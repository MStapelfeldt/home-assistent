esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  min_version: 2026.3.0

esp32:
  board: esp32-c5
  variant: esp32c5
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  fast_connect: true
  reboot_timeout: 10min
  band_mode: 5GHZ
  enable_btm: true
  enable_rrm: true
  ap:

api:
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:
logger:
  baud_rate: 0  # 0 Enables logging, but disables serial-port logging to free CPU and memory

ota:
  platform: esphome
  encryption:

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: false
    active: true
    interval: 320ms
    window: 300ms
    
bluetooth_proxy:
  active: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal (dBm)"
    id: wifi_signal_db
    update_interval: 60s
    unit_of_measurement: "dBm"
    device_class: signal_strength
    accuracy_decimals: 0
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal (%)"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    device_class: ""
    accuracy_decimals: 0
    entity_category: "diagnostic"
  - platform: uptime
    name: "Uptime Sensor"
    update_interval: 60s
    entity_category: "diagnostic"
button:
  - platform: restart
    name: "Neu starten"
