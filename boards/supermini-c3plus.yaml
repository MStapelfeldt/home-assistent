substitutions:  
  pin_pir: GPIO5
  pin_ld2450_tx: GPIO4
  pin_ld2450_rx: GPIO3
  pin_ws2812: GPIO2
  pin_bh1750_sda: GPIO7
  pin_bh1750_scl: GPIO6
  onboard_led_pin: GPIO8

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Onboard RGB LED"
    pin:
      number: ${onboard_led_pin}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
